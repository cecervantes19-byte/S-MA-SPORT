<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar SŌMA</title><style>body{margin:0;background:#f3f2ef;color:#111;font:14px Arial}.top{padding:22px 5%;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}.logo{font:26px Georgia;letter-spacing:4px}.wrap{max-width:1100px;margin:35px auto;padding:0 20px}.box{background:#fff;border:1px solid #ddd;padding:24px;margin-bottom:22px}.form,.theme{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form input,.form textarea,.theme input{padding:12px;border:1px solid #ccc}.form textarea{grid-column:1/-1;min-height:80px}.actions{margin-top:15px;display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;padding:12px 18px;background:#111;color:#fff;cursor:pointer}.btn.light{background:#eee;color:#111}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid #eee;text-align:left}.thumb{width:50px;height:50px;object-fit:cover}.muted{color:#777;font-size:12px}.photoFiles{grid-column:1/-1;display:grid;gap:8px}.photoFiles input{width:100%}@media(max-width:700px){.form,.theme{grid-template-columns:1fr}.table{font-size:12px}.table .hide{display:none}}</style></head><body><header class="top"><div class="logo">SŌMA / ADMIN</div><a href="/" class="muted">Ver catálogo</a></header><div class="wrap"><div class="box"><h2>Apariencia de la página</h2><div class="theme"><label>Fondo<input id="bg" type="color"></label><label>Texto<input id="fg" type="color"></label><label>Botones<input id="accent" type="color"></label><label>Tarjetas<input id="card" type="color"></label><label>Marca<input id="brand"></label><label>Título<input id="headline"></label><label>Portada<input id="tagline"></label><label>WhatsApp<input id="watext"></label></div><button class="btn" onclick="saveTheme()">Guardar diseño</button></div><div class="box"><h2 id="title">Nuevo producto</h2><div class="form"><input id="name" placeholder="Nombre"><input id="price" type="number" step=".01" placeholder="Precio MXN"><input id="stock" type="number" placeholder="Inventario"><select id="category"><option value="">Selecciona categoría</option><option>Chamarras</option><option>Shorts</option><option>Pants</option><option>Playeras</option><option>Dispositivos</option></select><input id="sizes" placeholder="Tallas"><input id="colors" placeholder="Colores"><input id="image_url" placeholder="URL de imagen principal (opcional)"><textarea id="description" placeholder="Descripción"></textarea><div class="photoFiles"><b>Fotos del producto · hasta 5</b><input class="photoFile" type="file" accept="image/*"><input class="photoFile" type="file" accept="image/*"><input class="photoFile" type="file" accept="image/*"><input class="photoFile" type="file" accept="image/*"><input class="photoFile" type="file" accept="image/*"><span id="photoStatus" class="muted">Puedes seleccionar de 1 a 5 fotos.</span></div></div><div class="actions"><button class="btn light" onclick="save()">Guardar producto</button><button class="btn light" onclick="resetForm()">Limpiar</button></div></div><div class="box"><h2>Inventario</h2><table class="table"><thead><tr><th>Foto</th><th>Producto</th><th class="hide">Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>let items=[],editing=null,currentImages=[];const $=id=>document.getElementById(id);const defaults={bg:"#f5f4f1",fg:"#111",accent:"#111",card:"#fff",brand:"SŌMA",headline:"MOVE | IN YOUR | FORM.",tagline:"Ropa deportiva diseñada para acompañarte en movimiento.",watext:"💬 Comprar por WhatsApp"};function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}function parseImages(v){try{const a=JSON.parse(v||"");if(Array.isArray(a))return a.filter(Boolean).slice(0,5)}catch(e){}return v?[v]:[]}async function loadTheme(){const r=await fetch("/api/settings/get",{cache:"no-store"});const t={...defaults,...(r.ok?await r.json():{})};Object.keys(t).forEach(k=>$(k).value=t[k])}async function load(){await loadTheme();const r=await fetch("/api/products/list",{cache:"no-store"});items=await r.json();rows.innerHTML=items.map(x=>'<tr><td><img class="thumb" src="'+(parseImages(x.image_url)[0]||"")+'"></td><td>'+esc(x.name)+'</td><td class="hide">'+esc(x.category)+'</td><td>$'+Number(x.price).toFixed(2)+'</td><td>'+x.stock+'</td><td><button onclick="edit(\''+x.id+'\')">Editar</button> <button onclick="del(\''+x.id+'\')">Eliminar</button></td></tr>').join("")}function edit(id){const x=items.find(a=>a.id===id);editing=id;currentImages=parseImages(x.image_url);$("title").textContent="Editar producto";["name","price","stock","category","sizes","colors","description"].forEach(k=>$(k).value=x[k]??"");$("image_url").value=currentImages[0]||"";scrollTo(0,0)}async function optimizeImage(file){if(!file||!file.type.startsWith("image/"))return file;const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject});const max=1400,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));if(scale===1&&file.size<180000)return file;const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/webp",0.78));if(!blob||blob.size>=file.size)return file;return new File([blob],file.name.replace(/\\.[^.]+$/,"")+".webp",{type:"image/webp",lastModified:Date.now()})}catch(e){return file}finally{URL.revokeObjectURL(url)}}async function uploadFile(f){const optimized=await optimizeImage(f);const fd=new FormData();fd.append("file",optimized);const r=await fetch("/api/products/upload",{method:"POST",body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||"No se pudo subir");return j.url}async function save(){try{const files=[...document.querySelectorAll(".photoFile")].map(x=>x.files[0]).filter(Boolean);if(files.length){$("photoStatus").textContent="Subiendo "+files.length+" foto(s)...";for(const f of files){if(currentImages.length>=5)break;currentImages.push(await uploadFile(f))}}const urls=currentImages.slice(0,5);if(!urls.length&&$("image_url").value.trim())urls.push($("image_url").value.trim());const b={id:editing,name:$("name").value,price:$("price").value,stock:$("stock").value,category:$("category").value,sizes:$("sizes").value,colors:$("colors").value,image_url:JSON.stringify(urls),description:$("description").value};const r=await fetch("/api/products/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});if(!r.ok)throw new Error("No se pudo guardar");alert("Producto guardado con "+urls.length+" foto(s)");resetForm();await load()}catch(e){alert(e.message)}}async function del(id){if(!confirm("¿Eliminar producto?"))return;await fetch("/api/products/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});load()}function resetForm(){editing=null;currentImages=[];$("title").textContent="Nuevo producto";["name","price","stock","category","sizes","colors","image_url","description"].forEach(k=>$(k).value="");document.querySelectorAll(".photoFile").forEach(x=>x.value="");$("photoStatus").textContent="Puedes seleccionar de 1 a 5 fotos."}async function saveTheme(){const b={bg:$("bg").value,fg:$("fg").value,accent:$("accent").value,card:$("card").value,brand:$("brand").value,headline:$("headline").value,tagline:$("tagline").value,watext:$("watext").value};const r=await fetch("/api/settings/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});alert(r.ok?"Diseño guardado correctamente":"No se pudo guardar")}load();</script></body></html>
