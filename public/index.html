<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SŌMA | Ropa deportiva</title><style>:root{--bg:#f5f4f1;--fg:#111;--muted:#666;--card:#fff;--line:#ddd;--accent:#111}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}.nav{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:5;background:var(--bg)}.logo{font:28px Georgia;letter-spacing:5px}.actions{display:flex;gap:8px}.cartTop{font-size:12px;border:1px solid var(--fg);padding:10px 14px;background:transparent;color:var(--fg);cursor:pointer}.adminlink,.wa{font-size:12px;border:1px solid var(--fg);padding:10px 14px;text-decoration:none;color:var(--fg)}.wa{background:var(--accent);color:#fff}.hero{padding:72px 6% 55px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:end}.hero h1{font:500 clamp(55px,9vw,120px)/.88 Georgia;letter-spacing:-5px;margin:0}.hero p{max-width:480px;color:var(--muted);line-height:1.7}.heroCard{min-height:300px;background:url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=900&q=65") center/cover;filter:grayscale(1)}main{padding:20px 6% 80px}.tools{margin:10px 0 28px}.tools input{width:100%;padding:14px;border:1px solid var(--line);background:var(--card)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--card)}.gallery{position:relative;width:100%;aspect-ratio:1/1.15;overflow:hidden;background:var(--card);touch-action:pan-y}.gallery img{width:100%;height:100%;object-fit:cover;filter:none;display:block}.gbtn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:#ffffffee;color:#111;cursor:pointer;font-size:25px;line-height:40px}.prev{left:10px}.next{right:10px}.gcount{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#ffffffee;color:#111;padding:5px 9px;border-radius:20px;font-size:10px;letter-spacing:1px}.info{padding:17px}.name{font-family:'Blazing','Impact','Arial Black',sans-serif;font-size:16px;font-weight:800;letter-spacing:1px;text-transform:uppercase;line-height:1.2;text-align:center}.desc{font-size:12px;color:var(--muted);margin:8px 0;min-height:34px}.row{display:flex;justify-content:space-between;align-items:center}.price{font-weight:600}.stock{font-family:Georgia,'Times New Roman',serif;font-size:12px;font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#fff;display:inline-block;animation:availabilityRefresh 4.8s ease-in-out infinite}@keyframes availabilityRefresh{0%,100%{opacity:1;transform:translateY(0)}45%{opacity:.35;transform:translateY(-1px)}65%{opacity:.7;transform:translateY(0)}}.sold{color:#999}.empty{text-align:center;padding:60px;color:var(--muted)}.addCart{width:100%;margin-top:14px;padding:12px;border:1px solid var(--fg);background:var(--fg);color:#fff;cursor:pointer;font-size:12px;letter-spacing:1px}.addCart:disabled{opacity:.4;cursor:not-allowed}.cartOverlay{position:fixed;inset:0;background:#0008;z-index:50;display:none;justify-content:flex-end}.cartOverlay.open{display:flex}.cartPanel{background:var(--bg);color:var(--fg);width:min(460px,100%);height:100%;overflow:auto;padding:24px;box-shadow:-10px 0 40px #0002}.cartHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.cartHead h2{font:28px Georgia;margin:0}.closeCart{border:1px solid var(--line);background:var(--card);padding:8px 12px;cursor:pointer}.cartItem{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.cartItem img{width:72px;height:85px;object-fit:cover}.cartItemTitle{font-weight:600}.cartItemPrice{font-size:13px;margin-top:6px}.qty{display:flex;align-items:center;gap:12px;margin-top:10px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:var(--card);cursor:pointer}.removeItem{border:0;background:none;text-decoration:underline;color:var(--muted);cursor:pointer;font-size:11px;margin-left:auto}.cartTotal{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;padding:22px 0}.checkout{width:100%;padding:15px;background:var(--accent);color:#fff;border:0;cursor:pointer;letter-spacing:1px}.cartNote{font-size:12px;color:var(--muted);line-height:1.5}.floating{position:fixed;right:20px;bottom:20px;background:var(--accent);color:#fff;padding:15px 18px;text-decoration:none;z-index:20}@media(max-width:800px){.hero{grid-template-columns:1fr}.heroCard{min-height:240px}}@media(max-width:500px){.nav{padding:0 4%}.hero,main{padding-left:4%;padding-right:4%}.adminlink{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gallery{aspect-ratio:1/1}.info{padding:10px}.name{font-size:13px}.desc{font-size:11px;min-height:28px}.price{font-size:12px}.stock{font-size:9px}.addCart{font-size:10px;padding:10px 4px;margin-top:9px}}.rotatingSections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 auto 24px;max-width:96%}.rotatingCard{background:#e8e0d4;min-width:0;max-width:98%;justify-self:center;overflow:hidden;border:1px solid #d6c8b7}.rotatingCard img{width:100%;aspect-ratio:1/0.92;object-fit:cover;display:block;transition:opacity .35s}.rotatingInfo{padding:11px;background:#e8e0d4;color:#24201b}.rotatingLabel{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:13px;letter-spacing:2.5px;color:#24201b;margin:0 auto 8px;text-align:center;font-weight:700;animation:newSoft 2.8s ease-in-out infinite}@keyframes newSoft{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.78;transform:translateY(-2px)}}.rotatingName{font-family:'Blazing','Impact', 'Arial Black',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:center;min-height:34px;line-height:1.2}.rotatingPrice{font-size:13px;margin-top:8px;font-weight:600}.rotatingCard .addCart{margin-top:12px}@media(max-width:800px){.rotatingSections{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}@media(max-width:500px){.rotatingSections{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.rotatingInfo{padding:10px}.rotatingName{font-size:12px}} </style></head><body><header class="nav"><div class="logo" id="brand">SŌMA</div><div class="actions"><button class="cartTop" id="openCart" type="button">🛍️ Carrito (<span id="cartCount">0</span>)</button><a class="adminlink" href="/admin.html">ADMINISTRAR</a></div></header><section class="hero"><div><h1 id="headline">MOVE<br>IN YOUR<br>FORM.</h1><p id="tagline">Ropa deportiva diseñada para acompañarte en movimiento.</p></div><div class="heroCard"></div></section><main><div class="tools"><input id="q" placeholder="Buscar producto..."></div><div id="cats" style="display:flex;gap:8px;overflow:auto;margin:0 0 28px;padding-bottom:4px"></div><div id="rotatingSections" class="rotatingSections" aria-label="Artículos destacados que cambian automáticamente"></div><div id="grid" class="grid"></div></main><div class="cartOverlay" id="cartOverlay" role="dialog" aria-modal="true" aria-label="Carrito de compras"><section class="cartPanel"><div class="cartHead"><h2>Tu carrito</h2><button class="closeCart" id="closeCart" type="button">Cerrar ✕</button></div><div id="cartItems"></div><div class="cartTotal"><span>Total</span><span id="cartTotal">$0.00 MXN</span></div><p class="cartNote">El pedido se enviará por WhatsApp para confirmar disponibilidad, envío y pago.</p><button class="checkout" id="checkout" type="button">PAGAR POR WHATSAPP</button></section></div><script>const grid=document.querySelector("#grid"),q=document.querySelector("#q");let data=[],activeCat="Todas";const cats=["Todas","Chamarras","Shorts","Pants","Playeras","Dispositivos"];const catsEl=document.querySelector("#cats");catsEl.style.cssText="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 20px;padding-bottom:4px";cats.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.type="button";b.style.cssText="border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 16px;white-space:nowrap;cursor:pointer";b.onclick=()=>{activeCat=c;document.querySelectorAll("#cats button").forEach(x=>{x.style.background="var(--card)";x.style.color="var(--fg)"});b.style.background="var(--fg)";b.style.color="var(--card)";render()};catsEl.appendChild(b)});const defaults={bg:"#f5f4f1",fg:"#111",accent:"#111",card:"#fff",brand:"SŌMA",headline:"MOVE | IN YOUR | FORM.",tagline:"Ropa deportiva diseñada para acompañarte en movimiento.",watext:"💬 Comprar por WhatsApp"};function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}function images(x){try{const a=JSON.parse(x.image_url||"");if(Array.isArray(a))return a.filter(Boolean).slice(0,5)}catch(e){}return x.image_url?[x.image_url]:[]}let cart=[];const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})+' MXN';function cartAdd(id){const p=data.find(x=>String(x.id)===String(id));if(!p||Number(p.stock)<1)return;const found=cart.find(x=>String(x.id)===String(id));if(found){if(found.qty<Number(p.stock))found.qty++}else cart.push({id:p.id,qty:1});renderCart()}function cartQty(id,delta){const c=cart.find(x=>String(x.id)===String(id));const p=data.find(x=>String(x.id)===String(id));if(!c)return;c.qty+=delta;if(c.qty<1)cart=cart.filter(x=>String(x.id)!==String(id));else if(p&&c.qty>Number(p.stock))c.qty=Number(p.stock);renderCart()}function renderCart(){cart=cart.filter(c=>data.some(p=>String(p.id)===String(c.id)));const count=cart.reduce((n,c)=>n+c.qty,0);document.querySelector('#cartCount').textContent=count;const el=document.querySelector('#cartItems');if(!cart.length){el.innerHTML='<div class="empty">Tu carrito está vacío.<br>Agrega tus favoritos para comenzar.</div>';document.querySelector('#checkout').disabled=true;document.querySelector('#checkout').style.opacity='.45'}else{el.innerHTML=cart.map(c=>{const p=data.find(x=>String(x.id)===String(c.id));const im=images(p);return '<div class="cartItem"><img loading="lazy" decoding="async" src="'+esc(im[0]||'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=200&q=65')+'" alt="'+esc(p.name)+'"><div><div class="cartItemTitle">'+esc(p.name)+'</div><div class="cartItemPrice">'+money(p.price)+' c/u</div><div class="qty"><button type="button" data-cart-minus="'+esc(c.id)+'">−</button><span>'+c.qty+'</span><button type="button" data-cart-plus="'+esc(c.id)+'" '+(c.qty>=Number(p.stock)?'disabled':'')+'>+</button><button class="removeItem" type="button" data-cart-remove="'+esc(c.id)+'">Quitar</button></div></div></div>'}).join('');document.querySelector('#checkout').disabled=false;document.querySelector('#checkout').style.opacity='1'}document.querySelector('#cartTotal').textContent=money(cart.reduce((n,c)=>{const p=data.find(x=>String(x.id)===String(c.id));return n+(p?Number(p.price)*c.qty:0)},0));el.querySelectorAll('[data-cart-minus]').forEach(b=>b.onclick=()=>cartQty(b.dataset.cartMinus,-1));el.querySelectorAll('[data-cart-plus]').forEach(b=>b.onclick=()=>cartQty(b.dataset.cartPlus,1));el.querySelectorAll('[data-cart-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(c=>String(c.id)!==b.dataset.cartRemove);renderCart()})}function openCart(){document.querySelector('#cartOverlay').classList.add('open');renderCart()}function closeCart(){document.querySelector('#cartOverlay').classList.remove('open')}document.querySelector('#openCart').onclick=openCart;document.querySelector('#closeCart').onclick=closeCart;document.querySelector('#cartOverlay').addEventListener('click',e=>{if(e.target.id==='cartOverlay')closeCart()});document.querySelector('#checkout').onclick=()=>{if(!cart.length)return;const lines=cart.map(c=>{const p=data.find(x=>String(x.id)===String(c.id));return p?c.qty+' x '+p.name+' — '+money(Number(p.price)*c.qty):''}).filter(Boolean);const total=cart.reduce((n,c)=>{const p=data.find(x=>String(x.id)===String(c.id));return n+(p?Number(p.price)*c.qty:0)},0);const msg='Hola, quiero hacer un pedido en SOMA:\n\n'+lines.join('\n')+'\n\nTOTAL A PAGAR: '+money(total)+'\n\n¿Me confirman disponibilidad, envío y forma de pago?';window.location.href='https://wa.me/522293644159?text='+encodeURIComponent(msg)};let rotatingTimers=[];function renderRotators(products){const box=document.querySelector('#rotatingSections');rotatingTimers.forEach(clearInterval);rotatingTimers=[];box.innerHTML='';box.style.display=activeCat==='Todas'&&!q.value.trim()&&products.length?'grid':'none';if(box.style.display==='none')return;for(let slot=0;slot<4;slot++){const card=document.createElement('article');card.className='rotatingCard';box.appendChild(card);let step=0;const paint=()=>{if(!products.length)return;const p=products[(slot+step)%products.length],im=images(p),src=im[0]||'https://images.unsplash.com/photo-1517838277536-f5f99be50190?auto=format&fit=crop&w=900&q=80';card.innerHTML='<img loading="lazy" decoding="async" src="'+esc(src)+'" alt="'+esc(p.name)+'"><div class="rotatingInfo"><div class="rotatingLabel">NUEVO</div><div class="rotatingName">'+esc(p.name)+'</div><div class="rotatingPrice">'+money(p.price)+'</div><button class="addCart" type="button" '+(!Number(p.stock)?'disabled':'')+'>'+(Number(p.stock)?'AGREGAR AL CARRITO':'AGOTADO')+'</button></div>';card.querySelector('button').onclick=()=>{cartAdd(p.id);const b=card.querySelector('button');if(Number(p.stock)>0){b.textContent='✓ AGREGADO';setTimeout(()=>{if(b.isConnected)b.textContent='AGREGAR AL CARRITO'},1200)}}};paint();rotatingTimers.push(setInterval(()=>{step=(step+1)%products.length;paint()},3000))}}function render(){const s=q.value.toLowerCase();const a=data.filter(x=>(activeCat==="Todas"||String(x.category||"").toLowerCase()===activeCat.toLowerCase())&&(x.name+" "+x.category+" "+x.description).toLowerCase().includes(s));renderRotators(a);grid.innerHTML=a.length?a.map((x,i)=>{const im=images(x);const imgs=im.length?im:["https://images.unsplash.com/photo-1517838277536-f5f99be50190?auto=format&fit=crop&w=900&q=80"];return '<article class="card"><div class="gallery" data-i="'+i+'"><img loading="lazy" decoding="async" src="'+esc(imgs[0])+'" alt="'+esc(x.name)+'">'+(imgs.length>1?'<button class="gbtn prev" type="button">‹</button><button class="gbtn next" type="button">›</button><div class="gcount">1 / '+imgs.length+"</div>":"")+'</div><div class="info"><div class="name">'+esc(x.name)+'</div><div class="desc">'+esc(x.description)+'</div><div class="row"><span class="price">$'+Number(x.price).toLocaleString("es-MX",{minimumFractionDigits:2})+' MXN</span><span class="stock '+(!Number(x.stock)?"sold":"")+'">'+(Number(x.stock)?x.stock+" disponibles":"Agotado")+"</span></div><button class=\"addCart\" type=\"button\" data-add-cart=\""+esc(x.id)+"\" "+(!Number(x.stock)?"disabled":"")+">"+(Number(x.stock)?"AGREGAR AL CARRITO":"AGOTADO")+"</button></div></article>"}).join(""):'<div class="empty">No encontramos productos.</div>';grid.querySelectorAll("[data-add-cart]").forEach(b=>{b.addEventListener("click",()=>{cartAdd(b.getAttribute("data-add-cart"));const original=Number(data.find(p=>String(p.id)===b.getAttribute("data-add-cart"))?.stock)>0?"AGREGAR AL CARRITO":"AGOTADO";b.textContent="✓ AGREGADO";setTimeout(()=>{if(b.isConnected)b.textContent=original},1200)})});document.querySelectorAll(".gallery").forEach((g,i)=>{const imgs=images(a[i]);if(imgs.length<2)return;let n=0,start=0;const pic=g.querySelector("img"),count=g.querySelector(".gcount");const show=()=>{pic.loading="lazy";pic.decoding="async";pic.src=imgs[n];count.textContent=(n+1)+" / "+imgs.length};g.querySelector(".prev").onclick=()=>{n=(n-1+imgs.length)%imgs.length;show()};g.querySelector(".next").onclick=()=>{n=(n+1)%imgs.length;show()};g.addEventListener("touchstart",e=>start=e.changedTouches[0].screenX,{passive:true});g.addEventListener("touchend",e=>{const d=e.changedTouches[0].screenX-start;if(Math.abs(d)>40){n=(n+(d<0?1:-1)+imgs.length)%imgs.length;show()}},{passive:true})})}async function loadTheme(){try{const r=await fetch("/api/settings/get",{cache:"no-store"});const t={...defaults,...(r.ok?await r.json():{})};document.documentElement.style.setProperty("--bg",t.bg);document.documentElement.style.setProperty("--fg",t.fg);document.documentElement.style.setProperty("--accent",t.accent);document.documentElement.style.setProperty("--card",t.card);brand.textContent=t.brand;headline.innerHTML=esc(t.headline).replace(/\|/g,"<br>");tagline.textContent=t.tagline;waFloat.textContent=t.watext}catch(e){}}async function load(){await loadTheme();const r=await fetch("/api/products/list",{cache:"no-store"});data=await r.json();render()}q.oninput=render;load();</script></body></html>
