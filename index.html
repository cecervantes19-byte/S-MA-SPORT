<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SŌMA — Ropa deportiva</title><style>
:root{--bg:#f5f4f1;--fg:#111;--muted:#777;--card:#fff;--line:#dedbd5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;background:#f5f4f1ed;z-index:5}.logo{font:28px Georgia;letter-spacing:5px}.actions{display:flex;gap:8px}.btn,.adminlink{font-size:11px;letter-spacing:1px;border:1px solid #111;padding:11px 14px;background:transparent;color:#111;text-decoration:none;cursor:pointer}.hero{padding:65px 6% 48px;display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:end}.hero h1{font:500 clamp(54px,8.8vw,116px)/.87 Georgia;letter-spacing:-5px;margin:0}.hero p{max-width:440px;color:var(--muted);line-height:1.7;font-size:14px}.heroCard{min-height:300px;background:linear-gradient(#0002,#0002),url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1100&q=85') center/cover;filter:grayscale(1)}main{padding:18px 6% 80px}.tools input{width:100%;padding:14px;border:1px solid var(--line);background:white;font-size:14px}.cats{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 24px}.cat{border:1px solid var(--line);background:white;padding:10px 14px;cursor:pointer;font-size:11px}.cat.active{background:#111;color:white}.label{font:italic 13px Georgia;letter-spacing:2px;margin:24px 0 14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:white;min-width:0}.gallery{position:relative;aspect-ratio:1/1.15;overflow:hidden;background:#e9e7e2}.gallery img{width:100%;height:100%;object-fit:cover;display:block}.gbtn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:#ffffffdf;cursor:pointer;font-size:22px}.prev{left:8px}.next{right:8px}.gcount{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);background:#ffffffdf;padding:5px 9px;border-radius:20px;font-size:10px}.info{padding:15px}.name{text-align:center;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;min-height:32px}.desc{font-size:12px;color:var(--muted);margin:8px 0;min-height:30px;line-height:1.45}.priceRow{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}.price{font-weight:700}.stock{font-size:10px;color:#777}.add{width:100%;margin-top:13px;padding:12px 6px;border:1px solid #111;background:#111;color:#fff;cursor:pointer;font-size:10px;letter-spacing:1px}.add:disabled{opacity:.4}.empty{text-align:center;padding:60px;color:var(--muted)}.overlay{position:fixed;inset:0;background:#0008;z-index:20;display:none;justify-content:flex-end}.overlay.open{display:flex}.panel{width:min(460px,100%);height:100%;overflow:auto;background:var(--bg);padding:24px}.cartHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px}.cartHead h2{font:28px Georgia;margin:0}.cartItem{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.cartItem img{width:72px;height:85px;object-fit:cover}.qty{display:flex;align-items:center;gap:10px;margin-top:10px}.qty button{width:28px;height:28px;background:white;border:1px solid var(--line)}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;padding:20px 0}.checkout{width:100%;padding:15px;background:#111;color:#fff;border:0;letter-spacing:1px;cursor:pointer}.note{font-size:12px;line-height:1.5;color:var(--muted)}footer{border-top:1px solid var(--line);padding:24px 6%;display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;color:var(--muted)}@media(max-width:800px){.hero{grid-template-columns:1fr}.heroCard{min-height:240px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.nav{padding:0 4%;height:62px}.logo{font-size:23px}.adminlink{display:none}.hero,main{padding-left:4%;padding-right:4%}.hero{padding-top:42px}.hero h1{letter-spacing:-3px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.info{padding:10px}.name{font-size:12px}.desc{font-size:11px;min-height:30px}.priceRow{font-size:11px}.add{font-size:9px;padding:11px 3px}.cats{gap:6px}.cat{padding:9px 10px;font-size:10px}}
</style></head><body>
<header class="nav"><div class="logo" id="brand">SŌMA</div><div class="actions"><button class="btn" id="openCart">🛍 Carrito (<span id="count">0</span>)</button><a class="adminlink" href="./admin.html">ADMINISTRAR ↗</a></div></header>
<section class="hero"><div><h1 id="headline">MOVE<br>IN YOUR<br>FORM.</h1><p id="tagline">Ropa deportiva diseñada para acompañarte en movimiento.</p></div><div class="heroCard"></div></section>
<main><div class="tools"><input id="search" placeholder="Buscar productos..." aria-label="Buscar productos"></div><nav class="cats" id="cats"></nav><div class="label">SELECCIÓN SŌMA / NUEVOS FAVORITOS</div><div class="grid" id="grid"></div></main>
<div class="overlay" id="overlay"><section class="panel"><div class="cartHead"><h2>Tu carrito</h2><button class="btn" id="closeCart">CERRAR ✕</button></div><div id="items"></div><div class="total"><span>Total</span><span id="total">$0 MXN</span></div><p class="note">El pedido se enviará por WhatsApp para confirmar disponibilidad, envío y pago.</p><button class="checkout" id="checkout">PAGAR POR WHATSAPP</button></section></div><footer><span>SŌMA SPORT</span><span>MOVE IN YOUR FORM.</span></footer>
<script>
const KEY='soma_products_v1',SET='soma_settings_v1',WA='522293644159',fallback='https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=900&q=80';let products=[],active='Todas',cart=[];const categories=['Todas','Chamarras','Shorts','Pants','Playeras','Dispositivos'];const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})+' MXN';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{products=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){products=[]}try{const s=JSON.parse(localStorage.getItem(SET)||'{}');$('#brand').textContent=s.brand||'SŌMA';$('#headline').innerHTML=esc(s.headline||'MOVE | IN YOUR | FORM.').replace(/\|/g,'<br>');$('#tagline').textContent=s.tagline||'Ropa deportiva diseñada para acompañarte en movimiento.'}catch(e){}}
function imgs(p){return p.images&&p.images.length?p.images:[fallback]}
function drawCats(){$('#cats').innerHTML=categories.map(c=>'<button class="cat '+(active===c?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('');$('#cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;drawCats();render()})}
function render(){const q=$('#search').value.toLowerCase(),arr=products.filter(p=>(active==='Todas'||p.category===active)&&(String(p.name)+' '+String(p.description||'')+' '+String(p.category)).toLowerCase().includes(q));$('#grid').innerHTML=arr.length?arr.map((p,i)=>'<article class="card"><div class="gallery" data-i="'+i+'"><img src="'+esc(imgs(p)[0])+'" alt="'+esc(p.name)+'" loading="lazy">'+(imgs(p).length>1?'<button class="gbtn prev">‹</button><button class="gbtn next">›</button><div class="gcount">1 / '+imgs(p).length+'</div>':'')+'</div><div class="info"><div class="name">'+esc(p.name)+'</div><div class="desc">'+esc(p.description||'')+'</div><div class="priceRow"><span class="price">'+money(p.price)+'</span><span class="stock">'+(Number(p.stock)>0?Number(p.stock)+' disponibles':'Agotado')+'</span></div><button class="add" data-add="'+esc(p.id)+'" '+(Number(p.stock)>0?'':'disabled')+'>'+(Number(p.stock)>0?'AGREGAR AL CARRITO':'AGOTADO')+'</button></div></article>').join(''):'<div class="empty">Todavía no hay productos aquí.<br>Agrega artículos desde Administrar.</div>';$('#grid').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('#grid').querySelectorAll('.gallery').forEach(g=>{const p=arr[Number(g.dataset.i)],images=imgs(p);if(images.length<2)return;let n=0;const show=()=>{g.querySelector('img').src=images[n];g.querySelector('.gcount').textContent=(n+1)+' / '+images.length};g.querySelector('.prev').onclick=()=>{n=(n-1+images.length)%images.length;show()};g.querySelector('.next').onclick=()=>{n=(n+1)%images.length;show()};let start=0;g.ontouchstart=e=>start=e.changedTouches[0].screenX;g.ontouchend=e=>{const d=e.changedTouches[0].screenX-start;if(Math.abs(d)>45){n=(n+(d<0?1:-1)+images.length)%images.length;show()}}})}
function add(id){const p=products.find(x=>String(x.id)===String(id));if(!p||Number(p.stock)<1)return;const c=cart.find(x=>String(x.id)===String(id));if(c){if(c.qty<Number(p.stock))c.qty++}else cart.push({id:p.id,qty:1});drawCart()}
function drawCart(){cart=cart.filter(c=>products.some(p=>String(p.id)===String(c.id)));$('#count').textContent=cart.reduce((n,c)=>n+c.qty,0);$('#items').innerHTML=cart.length?cart.map(c=>{const p=products.find(x=>String(x.id)===String(c.id));return '<div class="cartItem"><img src="'+esc(imgs(p)[0])+'" alt=""><div><b>'+esc(p.name)+'</b><div class="note">'+money(p.price)+' c/u</div><div class="qty"><button data-minus="'+esc(c.id)+'">−</button><span>'+c.qty+'</span><button data-plus="'+esc(c.id)+'" '+(c.qty>=p.stock?'disabled':'')+'>+</button><button data-remove="'+esc(c.id)+'" class="btn">Quitar</button></div></div></div>'}).join(''):'<div class="empty">Tu carrito está vacío.<br>Agrega tus favoritos para comenzar.</div>';$('#total').textContent=money(cart.reduce((n,c)=>n+Number(products.find(p=>String(p.id)===String(c.id))?.price||0)*c.qty,0));$('#checkout').disabled=!cart.length;$('#items').querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>qty(b.dataset.minus,-1));$('#items').querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>qty(b.dataset.plus,1));$('#items').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(c=>String(c.id)!==b.dataset.remove);drawCart()})}
function qty(id,d){const c=cart.find(x=>String(x.id)===String(id)),p=products.find(x=>String(x.id)===String(id));if(!c)return;c.qty+=d;if(c.qty<1)cart=cart.filter(x=>String(x.id)!==String(id));if(p&&c.qty>p.stock)c.qty=p.stock;drawCart()}
$('#search').oninput=render;$('#openCart').onclick=()=>{$('#overlay').classList.add('open');drawCart()};$('#closeCart').onclick=()=>$('#overlay').classList.remove('open');$('#overlay').onclick=e=>{if(e.target.id==='overlay')$('#overlay').classList.remove('open')};$('#checkout').onclick=()=>{if(!cart.length)return;const lines=cart.map(c=>{const p=products.find(x=>String(x.id)===String(c.id));return c.qty+' × '+p.name+' — '+money(p.price*c.qty)}),total=cart.reduce((n,c)=>n+Number(products.find(p=>String(p.id)===String(c.id))?.price||0)*c.qty,0),msg='Hola, quiero hacer un pedido en SŌMA:\n\n'+lines.join('\n')+'\n\nTOTAL: '+money(total)+'\n\n¿Me confirman disponibilidad, envío y forma de pago?';window.location.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg)};
load();drawCats();render();drawCart();
</script></body></html>
